name: Review exact October test cleanup
on:
  push:
    branches: ['maintenance/remove-oct-test-20261106']
permissions:
  contents: read
concurrency:
  group: smart-fleet-exact-oct-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-sqlite scripts/test-cleanup.mjs
      - name: Verify eight requested test trips
        run: node scripts/cleanup-oct-test.mjs
        env:
          CLEANUP_APPLY: 'no'
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
