name: Deploy Smart Fleet

on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose Demo or Production
        required: true
        default: demo
        type: choice
        options:
          - demo
          - production

permissions:
  contents: read

concurrency:
  group: smart-fleet-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check existing Worker and database
        run: node scripts/prepare-deploy.mjs
        env:
          FLEET_DEPLOY_TARGET: ${{ inputs.target }}
          FLEET_DEMO_DATABASE_ID: ${{ vars.DEMO_DATABASE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy selected Worker
        run: ./node_modules/.bin/wrangler deploy --config .deploy.config.json --keep-vars
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Check login page
        run: node scripts/check-deployment.mjs
        env:
          FLEET_DEPLOY_TARGET: ${{ inputs.target }}
